<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050403" />
    <meta
      name="description"
      content="SportsFX is preparing something exciting. A new sports experience is coming soon."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050403'/%3E%3Cpath d='M18 14h28L32 28zm0 36h28L32 36zM14 18v28l14-14zm36 0v28L36 32z' fill='%23d95012'/%3E%3C/svg%3E"
    />
    <title>SportsFX — Coming Soon</title>
    <style>
      :root {
        color-scheme: dark;
        --black: #050403;
        --ink: #0c0704;
        --ember: #e45a17;
        --ember-deep: #9d2d08;
        --warm-white: #f7eee8;
        --muted: #a69085;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: var(--black);
        color: var(--warm-white);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body::before {
        content: "";
        position: fixed;
        inset: -35%;
        background:
          radial-gradient(circle at 50% 45%, rgba(228, 90, 23, 0.07), transparent 20%),
          radial-gradient(circle at 50% 50%, rgba(126, 34, 6, 0.045), transparent 34%);
        animation: breathe 7s ease-in-out infinite;
        pointer-events: none;
      }

      .grain {
        position: fixed;
        inset: 0;
        opacity: 0.16;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.32'/%3E%3C/svg%3E");
        mix-blend-mode: soft-light;
        pointer-events: none;
      }

      main {
        position: relative;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: clamp(1.5rem, 5vw, 4.5rem);
        isolation: isolate;
      }

      .halo {
        position: absolute;
        width: min(84vw, 72rem);
        aspect-ratio: 2.5 / 1;
        border-radius: 50%;
        background: radial-gradient(ellipse, rgba(216, 67, 10, 0.1), transparent 58%);
        filter: blur(18px);
        transform: translateY(-2vh);
        animation: drift 9s ease-in-out infinite;
        z-index: -1;
      }

      .content {
        width: min(90vw, 78rem);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        transform: translateY(-1.5vh);
      }

      .brand {
        width: 100%;
        max-width: 70rem;
        height: auto;
        display: block;
        object-fit: contain;
        filter:
          brightness(0) invert(96%) sepia(9%) saturate(284%) hue-rotate(330deg)
          brightness(104%) contrast(98%)
          drop-shadow(0 0 0.18rem rgba(255, 112, 35, 0.92))
          drop-shadow(0 0 0.6rem rgba(226, 69, 10, 0.62))
          drop-shadow(0 0 1.65rem rgba(134, 34, 5, 0.38));
        animation: ignition 1.5s cubic-bezier(0.2, 0.85, 0.3, 1) both,
          logo-pulse 5.5s ease-in-out 1.5s infinite;
      }

      .divider {
        width: clamp(3rem, 8vw, 6rem);
        height: 1px;
        margin: clamp(1.5rem, 3vw, 2.3rem) 0 clamp(1.2rem, 2.5vw, 1.8rem);
        background: linear-gradient(90deg, transparent, rgba(238, 99, 28, 0.88), transparent);
        box-shadow: 0 0 1rem rgba(228, 90, 23, 0.5);
      }

      h1 {
        margin: 0;
        max-width: 22ch;
        font-size: clamp(1.25rem, 2.2vw, 2rem);
        font-weight: 430;
        line-height: 1.25;
        letter-spacing: 0.045em;
        text-wrap: balance;
      }

      p {
        margin: 0.75rem 0 0;
        color: var(--muted);
        font-size: clamp(0.82rem, 1.2vw, 0.95rem);
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      footer {
        position: fixed;
        right: clamp(1.25rem, 4vw, 3rem);
        bottom: clamp(1.25rem, 3vw, 2rem);
        color: rgba(166, 144, 133, 0.55);
        font-size: 0.75rem;
        letter-spacing: 0.08em;
      }

      @keyframes ignition {
        from {
          opacity: 0;
          transform: scale(0.97);
          filter: brightness(0) invert(1) opacity(0);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes logo-pulse {
        0%,
        100% {
          opacity: 0.94;
        }
        50% {
          opacity: 1;
        }
      }

      @keyframes breathe {
        0%,
        100% {
          transform: scale(0.98);
          opacity: 0.75;
        }
        50% {
          transform: scale(1.04);
          opacity: 1;
        }
      }

      @keyframes drift {
        0%,
        100% {
          transform: translateY(-2vh) scale(0.95);
        }
        50% {
          transform: translateY(-1vh) scale(1.05);
        }
      }

      @media (max-width: 640px) {
        .content {
          width: min(92vw, 34rem);
        }

        .brand {
          width: 112%;
          max-width: none;
        }

        footer {
          left: 0;
          right: 0;
          text-align: center;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <main>
      <div class="halo" aria-hidden="true"></div>
      <section class="content" aria-labelledby="coming-soon">
        <img
          class="brand"
          src="assets/sportsfx-logo.png"
          alt="SportsFX"
          width="2126"
          height="740"
        />
        <div class="divider" aria-hidden="true"></div>
        <h1 id="coming-soon">Something exciting is coming.</h1>
        <p>Stay tuned</p>
      </section>
    </main>
    <footer>sportsfx.co.za</footer>
  </body>
</html>
